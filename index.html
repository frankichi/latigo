<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>El Látigo · Control de producción</title>
<meta name="description" content="Control de producción, insumos, costos, pacientes y ventas de El Látigo.">
<meta name="theme-color" content="#0b0f12">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="El Látigo">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="img/favicon-32.png" type="image/png" sizes="32x32">
<link rel="apple-touch-icon" href="img/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Alfa+Slab+One&family=Oswald:wght@500;600;700&family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
:root{
  --bg:#f6efe4; --card:#fffdf9; --ink:#1d1611; --muted:#76624f; --line:#eadcc7;
  --night:#0b0f12; --night-2:#17130f;
  --brand:#b8321a; --brand-2:#e3572a; --brand-soft:#fbe4dc;
  --gold:#e8a93a; --gold-2:#a8700f; --gold-soft:#fcefd4;
  --ok:#2e7d4f; --ok-soft:#e2f2e7; --warn:#b26b00; --warn-soft:#fdf0d5;
  --bad:#c0392b; --bad-soft:#fbe3df; --info:#2f5f8a; --info-soft:#e3eef8;
  --wa:#1fa855;
  --r:18px; --r-sm:12px;
  --shadow:0 1px 2px rgba(60,30,10,.06),0 4px 14px rgba(60,30,10,.07);
  --nav-h:68px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:"Nunito",system-ui,-apple-system,Segoe UI,Roboto,sans-serif;font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased;min-height:100vh}
body.noscroll{overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
a{color:inherit}
h1,h2,h3,h4{margin:0;line-height:1.2}
.muted{color:var(--muted)} .sm{font-size:.86rem} .t-ok{color:var(--ok)} .t-bad{color:var(--bad)} .t-warn{color:var(--warn)}

/* ---------- Top bar ---------- */
.top{position:sticky;top:0;z-index:30;display:flex;align-items:center;justify-content:space-between;gap:10px;
  padding:calc(8px + env(safe-area-inset-top)) 14px 8px;background:var(--night);color:#fff;
  border-bottom:2px solid var(--gold);box-shadow:0 3px 0 var(--night),0 5px 0 rgba(232,169,58,.55),0 8px 18px rgba(0,0,0,.25)}
.brand{display:flex;align-items:center;gap:10px;cursor:pointer;min-width:0}
.brand img{width:46px;height:46px;flex:none;border-radius:10px;outline:1.5px solid rgba(232,169,58,.6);outline-offset:2px}
.brand h1{font-family:"Alfa Slab One",Georgia,serif;font-weight:400;font-size:1.32rem;letter-spacing:1px;color:var(--gold);white-space:nowrap;text-transform:uppercase}
.brand p{margin:1px 0 0;font-family:"Oswald",sans-serif;font-weight:600;font-size:.68rem;letter-spacing:.6px;text-transform:uppercase;color:#f3d9a6;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand>div{min-width:0}
@media(max-width:370px){.brand p{display:none}}
@media(max-width:430px){.sync .lbl{display:none}.sync{padding:0;width:38px;height:38px;justify-content:center}.sync .dot{width:11px;height:11px}}
.top-actions{display:flex;align-items:center;gap:6px;flex:none}
.sync{display:flex;align-items:center;gap:6px;border:1px solid rgba(232,169,58,.35);background:rgba(255,255,255,.06);color:#f3d9a6;border-radius:999px;padding:7px 11px;font-size:.78rem;font-weight:700;cursor:pointer}
.sync .dot{width:9px;height:9px;border-radius:50%;background:#bbb}
.sync.ok .dot{background:#4ade80} .sync.err .dot{background:#ff6b5b} .sync.busy .dot{background:#fbbf24;animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.3}}
.icon-btn{border:0;background:transparent;width:38px;height:38px;border-radius:12px;display:grid;place-items:center;cursor:pointer;font-size:1.05rem;font-weight:900;flex:none}
.icon-btn.light{background:rgba(255,255,255,.06);border:1px solid rgba(232,169,58,.35);color:var(--gold)}
.icon-btn:active{transform:scale(.94)}

/* ---------- Layout ---------- */
main{max-width:980px;margin:0 auto;padding:16px 16px calc(var(--nav-h) + 90px + env(safe-area-inset-bottom))}
.page-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:4px 0 12px}
.page-head h2{font-size:1.45rem;font-weight:900}
.hero{position:relative;overflow:hidden;background:var(--night);color:#f3d9a6;border-radius:var(--r);padding:16px 16px 16px 112px;margin-bottom:14px;min-height:118px;border:2px solid var(--night);outline:1.5px solid var(--gold);outline-offset:-7px}
.hero img{position:absolute;left:10px;top:50%;transform:translateY(-50%);width:96px;height:96px;object-fit:cover;border-radius:12px}
.hero h2{font-family:"Alfa Slab One",Georgia,serif;font-weight:400;color:var(--gold);font-size:1.35rem;letter-spacing:.5px}
.hero p{margin:4px 0 0;font-size:.9rem}
.hero .slogan{font-family:"Oswald",sans-serif;font-weight:600;text-transform:uppercase;letter-spacing:.6px;color:var(--gold);font-size:.82rem;margin-top:6px}
.label-img{display:block;width:100%;max-width:300px;margin:0 auto 12px;border-radius:12px;box-shadow:var(--shadow)}
#splash{position:fixed;inset:0;z-index:100;background:var(--night);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;transition:opacity .45s,visibility .45s}
#splash.out{opacity:0;visibility:hidden}
#splash img{width:min(56vw,240px);border-radius:16px;animation:pop .7s ease-out both}
#splash b{font-family:"Alfa Slab One",Georgia,serif;font-weight:400;color:var(--gold);font-size:2rem;letter-spacing:1px}
#splash span{font-family:"Oswald",sans-serif;font-weight:600;color:#f3d9a6;letter-spacing:1px;text-transform:uppercase;font-size:.85rem}
@keyframes pop{from{transform:scale(.85);opacity:0}}
h3.sec{font-size:1.05rem;font-weight:800;margin:22px 0 10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:var(--shadow);margin-bottom:14px}
.card h3{font-size:1.05rem;font-weight:800;margin-bottom:4px}
.grid2{display:grid;gap:14px}
@media(min-width:760px){.grid2{grid-template-columns:1fr 1fr}}

/* hello */
.hello{margin:2px 0 14px}
.hello h2{font-size:1.5rem;font-weight:900}
.hello p{margin:2px 0 0;color:var(--muted)}

/* KPIs */
.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media(min-width:760px){.kpis{grid-template-columns:repeat(4,1fr)}}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:13px 13px 12px;box-shadow:var(--shadow);position:relative;overflow:hidden;min-width:0}
.kpi::before{content:"";position:absolute;inset:0 auto 0 0;width:5px;background:var(--line)}
.kpi.ok::before{background:var(--ok)} .kpi.bad::before{background:var(--bad)} .kpi.warn::before{background:var(--gold)} .kpi.wine::before{background:var(--brand-2)} .kpi.info::before{background:var(--info)}
.kpi-ic{font-size:1.2rem}
.kpi-l{font-size:.8rem;font-weight:800;color:var(--muted);margin-top:2px}
.kpi-v{font-size:1.25rem;font-weight:900;margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi-s{font-size:.74rem;color:var(--muted)}
.kpi.ok .kpi-v{color:var(--ok)} .kpi.bad .kpi-v{color:var(--bad)}

/* quick actions */
.quick{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
@media(min-width:760px){.quick{grid-template-columns:repeat(6,1fr)}}
.qa{border:1px solid var(--line);background:var(--card);border-radius:var(--r);padding:14px 6px 12px;display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer;box-shadow:var(--shadow);font-weight:800;font-size:.82rem;text-align:center;line-height:1.15;min-height:96px;justify-content:center}
.qa .e{font-size:1.75rem;width:48px;height:48px;border-radius:14px;display:grid;place-items:center;background:var(--gold-soft)}
.qa:nth-child(1) .e{background:var(--brand-soft)} .qa:nth-child(3) .e{background:var(--ok-soft)} .qa:nth-child(4) .e{background:var(--bad-soft)} .qa:nth-child(5) .e{background:var(--info-soft)}
.qa:active{transform:scale(.97)}

/* onboarding */
.onboard{background:linear-gradient(160deg,#fff8ea,#fffdf9);border-color:#f0d9a8}
.steps{list-style:none;margin:12px 0 10px;padding:0;display:grid;gap:8px}
.steps li{display:flex;align-items:center;gap:10px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:9px 10px;font-weight:700}
.steps li span:nth-child(2){flex:1}
.steps .n{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--gold-soft);color:var(--gold-2);font-weight:900;flex:none}
.steps li.ok{opacity:.65} .steps li.ok .n{background:var(--ok);color:#fff} .steps li.ok span:nth-child(2){text-decoration:line-through}

/* alerts */
.alerts{display:grid;gap:8px}
.alert{display:flex;align-items:center;gap:10px;padding:11px 12px;border-radius:14px;font-size:.92rem;border:1px solid}
.alert p{margin:0;flex:1}
.alert.warn{background:var(--warn-soft);border-color:#f2d59b} .alert.bad{background:var(--bad-soft);border-color:#f2c0b8} .alert.info{background:var(--info-soft);border-color:#c5d9ec}

/* tip */
.tip{display:flex;gap:10px;align-items:flex-start;background:var(--gold-soft);border:1px dashed #e7c27a;border-radius:14px;padding:10px 12px;margin-bottom:12px;font-size:.9rem}
.tip p{margin:0}
.tip>span{font-size:1.1rem;line-height:1.2}

/* buttons */
.btn{border:0;background:var(--night-2);color:var(--gold);font-weight:800;border-radius:14px;padding:12px 16px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;text-decoration:none;min-height:46px;white-space:nowrap}
.btn:active{transform:scale(.97)}
.btn.block{width:100%;margin-bottom:12px}
.btn.sm{padding:8px 12px;min-height:38px;font-size:.86rem;border-radius:11px}
.btn.ghost{background:#fff;color:var(--brand);border:1.5px solid var(--line)}
.btn.ok{background:var(--ok);color:#fff} .btn.gold{background:var(--gold);color:var(--night)} .btn.wa{background:var(--wa);color:#fff} .btn.danger{background:#fff;color:var(--bad);border:1.5px solid #f0c4bd}
.btn[disabled]{opacity:.5}
.btn-row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.btn-row .btn{flex:1}

/* segmented & chips */
.seg{display:flex;background:#efe3d2;border-radius:14px;padding:4px;gap:4px;margin-bottom:14px;overflow-x:auto;scrollbar-width:none}
.seg button{flex:1;border:0;background:transparent;border-radius:11px;padding:9px 10px;font-weight:800;font-size:.9rem;color:var(--muted);cursor:pointer;white-space:nowrap}
.seg button.on{background:#fff;color:var(--brand);box-shadow:0 1px 4px rgba(0,0,0,.08)}
.chips{display:flex;gap:7px;overflow-x:auto;padding-bottom:4px;margin-bottom:12px;scrollbar-width:none}
.chips::-webkit-scrollbar,.seg::-webkit-scrollbar{display:none}
.chip{border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:7px 13px;font-weight:800;font-size:.84rem;cursor:pointer;white-space:nowrap;color:var(--muted)}
.chip.on{background:var(--night-2);border-color:var(--night-2);color:var(--gold)}

/* toolbar & search */
.toolbar{display:flex;gap:8px;margin-bottom:10px}
.search{flex:1;min-width:0;border:1.5px solid var(--line);background:#fff;border-radius:14px;padding:11px 13px;font-size:16px;outline:none}
.search:focus{border-color:var(--gold)}

/* list items */
.list{display:grid;gap:10px}
@media(min-width:760px){.list{grid-template-columns:1fr 1fr}}
.item{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:13px 14px;box-shadow:var(--shadow);min-width:0}
.item-top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.item-top>div:first-child{min-width:0}
.item b{font-weight:800}
.amt{font-weight:900;font-size:1.08rem;white-space:nowrap}
.badges{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0 4px}
.badge{font-size:.74rem;font-weight:800;padding:3px 9px;border-radius:999px;background:#f1e7da;color:var(--muted)}
.badge.ok{background:var(--ok-soft);color:var(--ok)} .badge.warn{background:var(--warn-soft);color:var(--warn)} .badge.bad{background:var(--bad-soft);color:var(--bad)} .badge.info{background:var(--info-soft);color:var(--info)} .badge.gold{background:var(--gold-soft);color:var(--gold-2)}
.actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.minis{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:10px}
.minis>div{background:#f8f0e4;border-radius:11px;padding:7px 8px;min-width:0}
.minis small{display:block;font-size:.7rem;color:var(--muted);font-weight:700}
.minis b{font-size:.9rem;white-space:nowrap}
.stock{text-align:center;background:#f8f0e4;border-radius:12px;padding:5px 10px;min-width:64px}
.stock b{display:block;font-size:1.2rem}
.stock small{font-size:.68rem;font-weight:700;color:var(--muted)}
.bar{height:8px;background:#efe3d2;border-radius:99px;overflow:hidden;margin-top:9px}
.bar span{display:block;height:100%;border-radius:99px;background:var(--ok)}
.bar.warn span{background:var(--gold)} .bar.bad span{background:var(--bad)}
.avatar{width:42px;height:42px;border-radius:14px;background:var(--brand-soft);color:var(--brand);display:grid;place-items:center;font-weight:900;flex:none}
.cli-head{display:flex;gap:11px;align-items:center;min-width:0}
.cli-head>div{min-width:0}
.ellipsis{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* empty */
.empty{text-align:center;padding:26px 16px;background:var(--card);border:1.5px dashed var(--line);border-radius:var(--r)}
.empty-ic{font-size:2.6rem}
.empty h4{font-size:1.05rem;font-weight:800;margin:6px 0 4px}
.empty p{margin:0 0 12px;color:var(--muted);font-size:.92rem}

/* charts */
.chart-box{position:relative;height:250px}
.chart-box.tall{height:290px}

/* table */
.tbl-wrap{overflow-x:auto;margin:0 -4px}
table{width:100%;border-collapse:collapse;font-size:.88rem}
th,td{padding:9px 8px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:.74rem;text-transform:uppercase;letter-spacing:.4px;color:var(--muted)}
td.r,th.r{text-align:right}
.rank{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:8px;background:var(--gold-soft);color:var(--gold-2);font-weight:900;font-size:.8rem}

/* bottom nav */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:40;background:rgba(255,253,249,.97);backdrop-filter:blur(10px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.nav-in{max-width:620px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);height:var(--nav-h)}
.nav button{border:0;background:transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:.72rem;font-weight:800;color:var(--muted);cursor:pointer;position:relative}
.nav button .e{font-size:1.35rem;filter:grayscale(.6);opacity:.75;transition:.15s}
.nav button.on{color:var(--brand)}
.nav button.on .e{filter:none;opacity:1;transform:translateY(-1px) scale(1.08)}
.nav button.on::after{content:"";position:absolute;top:0;width:34px;height:3px;border-radius:0 0 4px 4px;background:var(--brand)}
.fab{position:fixed;right:18px;bottom:calc(var(--nav-h) + 16px + env(safe-area-inset-bottom));z-index:41;width:60px;height:60px;border-radius:20px;border:0;background:linear-gradient(140deg,#f4bd55,#c98612);color:var(--night);border:2px solid var(--night);outline:2px solid var(--gold);font-size:2rem;font-weight:900;box-shadow:0 8px 20px rgba(185,125,22,.45);cursor:pointer;display:grid;place-items:center}
.fab:active{transform:scale(.93)}
@media(min-width:1100px){.fab{right:calc(50% - 470px)}}

/* sheet (modal) */
.backdrop{position:fixed;inset:0;z-index:60;background:rgba(30,12,6,.48);display:flex;align-items:flex-end;justify-content:center;opacity:0;pointer-events:none;transition:opacity .2s}
.backdrop.open{opacity:1;pointer-events:auto}
.sheet{background:var(--bg);width:100%;max-width:600px;max-height:92vh;border-radius:24px 24px 0 0;display:flex;flex-direction:column;transform:translateY(30px);transition:transform .22s ease;box-shadow:0 -10px 40px rgba(0,0,0,.2)}
.backdrop.open .sheet{transform:none}
@media(min-width:700px){.backdrop{align-items:center}.sheet{border-radius:24px;max-height:88vh}}
.sheet-h{display:flex;align-items:center;justify-content:space-between;padding:14px 16px 10px;border-bottom:1px solid var(--line)}
.sheet-h h3{font-size:1.15rem;font-weight:900}
.hello h2,.sheet-h h3,.page-head h2{letter-spacing:-.2px}
.sheet-h::before{content:"";position:absolute;left:50%;margin-left:-22px;margin-top:-26px;width:44px;height:5px;border-radius:9px;background:#d8c6ae}
@media(min-width:700px){.sheet-h::before{display:none}}
.sheet form{display:flex;flex-direction:column;min-height:0;flex:1}
.sheet-b{padding:14px 16px;overflow-y:auto;flex:1;-webkit-overflow-scrolling:touch}
.sheet-f{display:flex;gap:8px;padding:12px 16px calc(12px + env(safe-area-inset-bottom));border-top:1px solid var(--line);background:#fffaf2;border-radius:0 0 24px 24px}
.sheet-f .btn{flex:1}
.sheet-f .btn.danger{flex:0 0 auto}

/* form */
.field{display:block;margin-bottom:12px}
.field>span{display:block;font-weight:800;font-size:.88rem;margin-bottom:5px}
.field input,.field select,.field textarea,.line input,.line select{width:100%;border:1.5px solid var(--line);background:#fff;border-radius:12px;padding:11px 12px;font-size:16px;outline:none;min-height:46px}
.field textarea{resize:vertical;min-height:70px}
.field input:focus,.field select:focus,.field textarea:focus,.line input:focus,.line select:focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(217,154,43,.18)}
.field small{display:block;color:var(--muted);font-size:.78rem;margin-top:4px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.row2>.field{min-width:0}
@media(max-width:380px){.row2.stack{grid-template-columns:1fr}}
.check{display:flex;align-items:center;gap:10px;background:#fff;border:1.5px solid var(--line);border-radius:12px;padding:12px;font-weight:800;margin-bottom:12px;cursor:pointer}
.check input{width:22px;height:22px;accent-color:var(--ok)}
.lines-head{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:6px 0 8px;flex-wrap:wrap}
.lines-cols{display:grid;grid-template-columns:1fr 62px 86px 34px;gap:6px;font-size:.72rem;font-weight:800;color:var(--muted);padding:0 2px 4px}
.lines{display:grid;gap:7px;margin-bottom:8px}
.line{display:grid;gap:6px;align-items:center}
.line.ped{grid-template-columns:1fr 62px 86px 34px}
.line.cons{grid-template-columns:1fr 78px 44px 34px}
.line input,.line select{padding:10px 8px;min-width:0}
.line .unit{font-size:.78rem;font-weight:800;color:var(--muted);text-align:center;overflow:hidden;text-overflow:ellipsis}
.line .icon-btn{width:34px;height:34px;background:var(--bad-soft);color:var(--bad);font-size:.9rem}
.subcard{background:#fff;border:1.5px dashed #e7c27a;border-radius:14px;padding:12px 12px 2px;margin-bottom:12px}
.subcard>b{display:block;margin-bottom:8px}
.calc{background:#fff;border:1.5px solid var(--line);border-radius:14px;padding:10px 12px;margin:6px 0 12px;font-size:.92rem}
.calc:empty{display:none}
.calc-row{display:flex;justify-content:space-between;gap:10px;padding:3px 0}
.calc-row.total{border-top:1px dashed var(--line);margin-top:4px;padding-top:7px}
.calc-row.big{font-size:1.1rem}
.calc-row.big b{color:var(--brand)}
.warnbox{background:var(--warn-soft);border-radius:10px;padding:8px 10px;margin-top:8px;font-size:.85rem}
.help h4{font-size:1rem;font-weight:900;margin:14px 0 4px}
.help p,.help li{font-size:.92rem;margin:0 0 6px}
.help ul,.help ol{padding-left:20px;margin:4px 0 8px}
.detail-row{display:flex;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:.93rem}
.detail-row>span:first-child{width:96px;flex:none;color:var(--muted);font-weight:700}
code{background:#f1e7da;border-radius:6px;padding:1px 6px;font-size:.85em;word-break:break-all}

/* confirm */

<script>
/* =========================================================================
   EL LÁTIGO · Sistema de control
   -------------------------------------------------------------------------
   Conexión fija con la hoja "Látigo_BD" (el usuario no configura nada).
   DEFAULT_TOKEN debe ser IGUAL a CLAVE_APP en apps-script/Code.gs.
   Herramientas técnicas (demo, subir/restaurar, borrar): abre la web con
   ?admin al final, ej.  https://tu-web.vercel.app/?admin
   ========================================================================= */
const DEFAULT_API_URL = 'https://script.google.com/macros/s/AKfycbzeEaoIGXxMvOWNnxM1lgtrcDaUGec--uw5fDpgFY2fiTMhXIbTl7PMm4WyzxInUL-6/exec';
const DEFAULT_TOKEN   = 'latigo-tah0or7h4j1nyt';
const ADMIN = /[?&#]admin\b/.test(location.search+location.hash);
const APP_VERSION = '2.4.0';
let installEvt=null;
const IS_IOS=/iphone|ipad|ipod/i.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
const esApp=()=>matchMedia('(display-mode: standalone)').matches||matchMedia('(display-mode: fullscreen)').matches||navigator.standalone===true;

/* ---------- Estructura de datos (igual que las hojas de Google Sheets) ---------- */
const SCHEMA = {
  Productos:  {f:['id','nombre','tipo','unidad','presentacion','precio','precioMayor','minMayor','caracteristicas','oculto','creado'], num:['precio','precioMayor','minMayor'], bool:['oculto']},
  Insumos:    {f:['id','nombre','unidad','categoria','stockInicial','stockMinimo','costoRef','creado'], num:['stockInicial','stockMinimo','costoRef']},
  Compras:    {f:['id','fecha','insumoId','cantidad','costoTotal','proveedor','nota','comprobanteUrl'], num:['cantidad','costoTotal']},
  Produccion: {f:['id','fecha','productoId','botellas','consumos','costoInsumos','costoLab','otrosCostos','costoTotal','nota'], num:['botellas','costoInsumos','costoLab','otrosCostos','costoTotal'], json:['consumos']},
  Clientes:   {f:['id','numero','registrado','zonaTipo','zona','limite','nota','creado'], num:['numero','limite'], bool:['registrado']},
  Pedidos:    {f:['id','fecha','clienteId','items','subtotal','total','estado','pagado','metodoPago','zonaTipo','zona','costoEnvio','costoEmbalaje','costoFlete','cobroEnvio','direccionEntrega','nota','comprobanteEnvioUrl','fechaEntrega','fechaCompromiso','fechaPago','historial','abonado','labEstado','labFecha','labPara','labNota','labA'], num:['subtotal','total','costoEnvio','costoEmbalaje','costoFlete','cobroEnvio','abonado'], json:['items','historial'], bool:['pagado']},
  Gastos:     {f:['id','fecha','categoria','descripcion','monto','quincena','comprobanteUrl'], num:['monto']},
  Comprobantes:{f:['id','fecha','tipo','monto','proveedor','nota','refTipo','refId','referencia','url','thumbUrl','deleteUrl','creado','etiqueta'], num:['monto']},
  Mensajes:   {f:['id','fecha','hora','clienteId','de','texto','fotos','pedidoId','origen','creado'], json:['fotos']},
};
const UNIDADES = ['L','ml','kg','g','unidad','caja','paquete'];
const INS_CATS = ['Materia prima','Envases','Etiquetas y empaques','Otros'];
const METODOS  = ['Efectivo','Yape','Plin','Transferencia','Tarjeta'];
const GASTO_CATS = [['Laboratorista','🧪'],['Mano de obra','👷'],['Delivery / transporte','🛵'],['Servicios (luz, agua, gas)','💡'],['Publicidad','📣'],['Alquiler','🏠'],['Permisos y trámites','📄'],['Otros','📦']];
const PERIODOS = [['mes','Este mes'],['mesAnt','Mes pasado'],['3m','Últimos 3 meses'],['anio','Este año'],['todo','Todo']];
const MESES = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
const MESES_L = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
const PAL = ['#b8321a','#e8a93a','#2e7d4f','#5a3524','#2f5f8a','#e3572a','#8c6d5a','#f3d9a6','#17130f'];

/* ---------- Almacenamiento local ---------- */
const CFG_KEY='latigo_cfg_v1', DB_KEY='latigo_db_v1', OUT_KEY='latigo_outbox_v1';
const load=(k,d)=>{try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}};
const store=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
let cfg = Object.assign({apiUrl:DEFAULT_API_URL, token:DEFAULT_TOKEN, negocio:'El Látigo', moneda:'S/', maxClientes:100}, load(CFG_KEY,{}));
cfg.apiUrl=DEFAULT_API_URL; cfg.token=DEFAULT_TOKEN;
const emptyDB=()=>{const o={};Object.keys(SCHEMA).forEach(k=>o[k]=[]);return o};

/* ---------- Utilidades ---------- */
const $=(s,el=document)=>el.querySelector(s);
const $$=(s,el=document)=>[...el.querySelectorAll(s)];
const pad=n=>String(n).padStart(2,'0');
const isoD=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const today=()=>isoD(new Date());
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const num=v=>{const n=parseFloat(String(v??'').replace(',','.'));return isFinite(n)?n:0};
const sum=(a,f)=>a.reduce((s,x)=>s+(Number(f(x))||0),0);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtNum=(n,d=2)=>(Number(n)||0).toLocaleString('es-PE',{maximumFractionDigits:d});
const money=n=>{n=Number(n)||0;const s=Math.abs(n).toLocaleString('es-PE',{minimumFractionDigits:2,maximumFractionDigits:2});return (n<0?'-':'')+cfg.moneda+' '+s};
const moneyShort=n=>{n=Number(n)||0;return cfg.moneda+' '+(Math.abs(n)>=1000?fmtNum(n/1000,1)+'k':fmtNum(n,0))};
const fmtDate=f=>{f=String(f||'').slice(0,10);if(!f)return '';const [y,m,d]=f.split('-');return `${+d} ${MESES[+m-1]||''} ${y}`};
const mk=f=>String(f||'').slice(0,7);
const mlabel=k=>MESES[+k.slice(5)-1]+' '+k.slice(2,4);
const byId=(sheet,id)=>DB[sheet].find(x=>x.id===id);
/* Pacientes = números del 1 al 100 (el nombre lo lleva el dueño en su cuaderno) */
const cliNum=id=>{const m=/^n(\d+)$/.exec(String(id||''));return m?+m[1]:0};
const cliId=n=>'n'+n;
const cliLabel=id=>{const n=cliNum(id);return n?`Paciente N° ${n}`:'Paciente sin número'};
const cliShort=id=>{const n=cliNum(id);return n?`N° ${n}`:'—'};
const isReg=n=>{const r=byId('Clientes',cliId(n));return !!(r&&r.registrado)};
const nReg=()=>DB.Clientes.filter(c=>c.registrado&&c.numero>0).length;
function maxCli(){let m=num(cfg.maxClientes)||100;DB.Clientes.forEach(c=>{if(c.registrado&&c.numero>m)m=c.numero});DB.Pedidos.forEach(p=>{const n=cliNum(p.clienteId);if(n>m)m=n});return m}
function setRegistrado(n,val){const old=byId('Clientes',cliId(n))||{};saveRow('Clientes',Object.assign({nota:'',zonaTipo:'',zona:''},old,{id:cliId(n),numero:n,registrado:!!val,creado:old.creado||today()}))}
function setZonaCliente(n,zt,z){const old=byId('Clientes',cliId(n))||{};if(old.zonaTipo===zt&&old.zona===z)return;saveRow('Clientes',Object.assign({nota:'',registrado:false},old,{id:cliId(n),numero:n,zonaTipo:zt,zona:z,creado:old.creado||today()}))}
/* ---- Envíos por pedido ---- */
const LIMA_DISTRITOS=['Ancón','Ate','Barranco','Breña','Carabayllo','Chaclacayo','Chorrillos','Cieneguilla','Comas','El Agustino','Independencia','Jesús María','La Molina','La Victoria','Lima Cercado','Lince','Los Olivos','Lurigancho-Chosica','Lurín','Magdalena del Mar','Miraflores','Pachacámac','Pucusana','Pueblo Libre','Puente Piedra','Punta Hermosa','Punta Negra','Rímac','San Bartolo','San Borja','San Isidro','San Juan de Lurigancho','San Juan de Miraflores','San Luis','San Martín de Porres','San Miguel','Santa Anita','Santa María del Mar','Santa Rosa','Santiago de Surco','Surquillo','Villa El Salvador','Villa María del Triunfo','Callao','Bellavista','Carmen de la Legua','La Perla','La Punta','Ventanilla','Mi Perú'];
const PROVINCIAS=['Abancay','Arequipa','Ayacucho','Barranca','Cajamarca','Cañete','Cerro de Pasco','Chachapoyas','Chiclayo','Chimbote','Chincha','Cusco','Huacho','Huancavelica','Huancayo','Huánuco','Huaral','Huaraz','Ica','Iquitos','Juliaca','Moquegua','Piura','Pisco','Pucallpa','Puerto Maldonado','Puno','Tacna','Tarapoto','Trujillo','Tumbes'];
const ZONA_TIPOS=[['Lima','🏙️ Lima (distrito)'],['Provincia','🛣️ Provincia'],['Recojo','🏠 Recoge el paciente']];
/* ---- Laboratorista: se le paga POR QUINCENA (1–15 y 16–fin de mes).
   Cada pago se reparte entre lo producido en esa quincena para que entre en el costo por unidad. ---- */
const LAB='Laboratorista';
const labPagos=()=>DB.Gastos.filter(g=>g.categoria===LAB);
const qKey=f=>{f=String(f||'').slice(0,10);return f.slice(0,7)+'-'+(+f.slice(8,10)<=15?1:2)};
function qRange(k){const [y,m,h]=k.split('-').map(Number);const last=new Date(y,m,0).getDate();return {from:`${y}-${pad(m)}-${h===1?'01':'16'}`,to:`${y}-${pad(m)}-${h===1?'15':pad(last)}`}}
function qLabel(k){const [y,m,h]=k.split('-').map(Number);const last=new Date(y,m,0).getDate();return `${h===1?'1–15':'16–'+last} ${MESES[m-1]} ${y}`}
function qPrev(k){let [y,m,h]=k.split('-').map(Number);if(h===2)return `${y}-${pad(m)}-1`;m--;if(!m){m=12;y--}return `${y}-${pad(m)}-2`}
const qDe=g=>g.quincena||qKey(g.fecha);
const labPagoQ=k=>sum(labPagos().filter(g=>qDe(g)===k),g=>g.monto);
const unidadesQ=(k,exceptId)=>sum(DB.Produccion.filter(l=>l.id!==exceptId&&qKey(l.fecha)===k),l=>l.botellas);

/* ===== BOLETAS / COMPROBANTES: el celular sube la imagen DIRECTO a ImgBB (ImgBB bloquea a los servidores de Google)
   y en la hoja queda solo el LINK. Nada en Google Drive. La API key se pide a Apps Script (no está escrita en la web). ===== */
const IMGBB_URL='https://api.imgbb.com/1/upload', IMGBB_CACHE='latigo_imgbb_k';
async function imgbbKey(force){
  if(!force){const k=load(IMGBB_CACHE,'');if(k) return k}
  const j=await api({action:'imgbbKey'}); store(IMGBB_CACHE,j.key); return j.key;
}
function dataUrlABlob(d){const [h,b]=d.split(',');const bin=atob(b),u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);return new Blob([u],{type:(h.match(/:(.*?);/)||[])[1]||'image/jpeg'})}
async function subirAImgbb(it,reintento){
  const key=await imgbbKey(reintento);
  const nombre=('latigo '+it.fecha+' '+(it.tipo||'boleta')).normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^A-Za-z0-9 _-]+/g,' ').replace(/\s+/g,'-').slice(0,80);
  const fd=new FormData(); fd.append('key',key); fd.append('name',nombre); fd.append('image',dataUrlABlob(it.data),nombre+'.jpg');
  let res; try{ res=await fetch(IMGBB_URL,{method:'POST',body:fd}) }catch(e){ throw new Error('Sin conexión') }
  let j={}; try{ j=await res.json() }catch(e){}
  if(!j.success||!j.data){
    const msg=(j.error&&j.error.message)||('código '+res.status);
    if(!reintento&&/key/i.test(msg)){ store(IMGBB_CACHE,''); return subirAImgbb(it,true) }   // key cambiada en Apps Script
    throw new Error('ImgBB: '+msg);
  }
  const d=j.data; return {url:d.url,thumbUrl:(d.thumb&&d.thumb.url)||d.display_url||d.url,deleteUrl:d.delete_url};
}

/* Todo se convierte a JPEG liviano antes de subir. Los PDF (escaneos) se pasan a imagen con pdf.js. */
const PDFJS_V='3.11.174', PDFJS_CDN=`https://cdnjs.cloudflare.com/ajax/libs/pdf.js/${PDFJS_V}/`;
let pdfjsP=null;
function cargarPdfJs(){
  if(window.pdfjsLib) return Promise.resolve(window.pdfjsLib);
  return pdfjsP||(pdfjsP=new Promise((res,rej)=>{const sc=document.createElement('script');sc.src=PDFJS_CDN+'pdf.min.js';
    sc.onload=()=>{try{window.pdfjsLib.GlobalWorkerOptions.workerSrc=PDFJS_CDN+'pdf.worker.min.js';res(window.pdfjsLib)}catch(e){rej(e)}};
    sc.onerror=()=>{pdfjsP=null;rej(new Error('Necesitas internet para leer el PDF'))};document.head.appendChild(sc)}));
}
function canvasAJpeg(c,maxLado){
  const k=Math.min(1,maxLado/Math.max(c.width,c.height));
  if(k<1){const o=document.createElement('canvas');o.width=Math.round(c.width*k);o.height=Math.round(c.height*k);const x=o.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,o.width,o.height);x.drawImage(c,0,0,o.width,o.height);c=o}
  return c.toDataURL('image/jpeg',.8);
}
async function pdfAImagen(file){
  const lib=await cargarPdfJs(), pdf=await lib.getDocument({data:await file.arrayBuffer()}).promise;
  const n=Math.min(pdf.numPages,6), pages=[];
  for(let i=1;i<=n;i++){const pg=await pdf.getPage(i),v0=pg.getViewport({scale:1}),sc=1300/v0.width,v=pg.getViewport({scale:sc});
    const c=document.createElement('canvas');c.width=Math.round(v.width);c.height=Math.round(v.height);const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);
    await pg.render({canvasContext:x,viewport:v}).promise;pages.push(c)}
  const W=Math.max(...pages.map(c=>c.width)),gap=pages.length>1?16:0,H=pages.reduce((a,c)=>a+c.height,0)+gap*(pages.length-1);
  const all=document.createElement('canvas');all.width=W;all.height=H;const x=all.getContext('2d');x.fillStyle='#d9d2c5';x.fillRect(0,0,W,H);
  let y=0;pages.forEach(c=>{x.drawImage(c,0,y);y+=c.height+gap});
  if(pdf.numPages>n) toast(`El PDF tiene ${pdf.numPages} páginas: se guardan las primeras ${n}`,'warn');
  return {name:file.name.replace(/\.pdf$/i,'')+'.jpg',mime:'image/jpeg',data:canvasAJpeg(all,6000),pages:n};
}
async function prepararArchivo(file){
  const pdf=file.type==='application/pdf'||/\.pdf$/i.test(file.name);
  const img=!pdf&&(/^image\//.test(file.type)||/\.(heic|heif|jpe?g|png|webp|gif|bmp)$/i.test(file.name));
  if(!pdf&&!img) throw new Error('Solo se aceptan fotos o PDF');
  if(file.size>25*1024*1024) throw new Error('El archivo pesa más de 25 MB');
  if(pdf){toast('Convirtiendo el PDF a imagen…');return pdfAImagen(file)}
  const url=URL.createObjectURL(file);
  try{
    const im=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=()=>rej(new Error('No se pudo leer la foto. Prueba con otra o toma la foto desde la app.'));i.src=url});
    const c=document.createElement('canvas');c.width=im.naturalWidth;c.height=im.naturalHeight;const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(im,0,0);
    return {name:file.name.replace(/\.[^.]+$/,'')+'.jpg',mime:'image/jpeg',data:canvasAJpeg(c,1600)};
  }finally{URL.revokeObjectURL(url)}
}

/* ---- WhatsApp con el comprobante del delivery ----
   wa.me no permite adjuntar fotos, así que se usa "Compartir" del celular (foto + texto → WhatsApp).
   Si el equipo no puede compartir archivos, se manda el texto con el link de la foto. */
const BOL_CACHE='latigo-boletas-v1';
async function cacheBoleta(url,data){try{if(!url||!data||!window.caches)return;const c=await caches.open(BOL_CACHE);await c.put(url,new Response(dataUrlABlob(data),{headers:{'Content-Type':'image/jpeg'}}))}catch(e){}}
async function blobBoleta(c){
  if(!c) return null;
  if(c._pend||c.data) return dataUrlABlob(c.data);
  try{if(window.caches){const r=await (await caches.open(BOL_CACHE)).match(c.url);if(r)return await r.blob()}}catch(e){}
  try{const r=await fetch(c.url,{mode:'cors'});if(r.ok){const b=await r.blob();if(/^image\//.test(b.type)){cacheBoletaBlob(c.url,b);return b}}}catch(e){}
  return null;
}
async function cacheBoletaBlob(url,b){try{if(window.caches)await (await caches.open(BOL_CACHE)).put(url,new Response(b,{headers:{'Content-Type':b.type||'image/jpeg'}}))}catch(e){}}

let flushing=null;
/* Si el Apps Script todavía no tiene una hoja nueva (ej. Mensajes), esos cambios se guardan aparte

const PARK_KEY='latigo_parked_v1'; let FALTA_BACKEND=load(PARK_KEY,[]).length>0;
function flushOutbox(){
  if(flushing) return flushing;
  flushing=(async()=>{await 0; try{
    let ob=load(OUT_KEY,[]);
    while(ob.length){
      try{ await api(ob[0]) }
      catch(e){ if(!/Hoja no permitida|Acci[oó]n desconocida/i.test(e.message||'')) throw e;
        const pk=load(PARK_KEY,[]); pk.push(ob[0]); store(PARK_KEY,pk); FALTA_BACKEND=true; }
      ob=load(OUT_KEY,[]); ob.shift(); store(OUT_KEY,ob); }
  } finally { flushing=null }})();
  return flushing;
}
async function push(op){
  if(!cfg.apiUrl) return;
  const ob=load(OUT_KEY,[]); ob.push(op); store(OUT_KEY,ob);
  setSync('busy');
  try{ await flushOutbox(); setSync('ok') }
  catch(e){ setSync('err'); toast('Sin conexión: guardado en el celular, se sube solo después 👍','warn') }
}

function waNum(n){let d=String(n||'').replace(/\D/g,''); if(d.length===9&&d[0]==='9') d='51'+d; return d}
const waLink=(n,msg)=>`https://wa.me/${n?waNum(n):''}${msg?'?text='+encodeURIComponent(msg):''}`;
function pedidoMsg(p,o={}){
  const lines=(p.items||[]).map(it=>`• ${fmtNum(it.cantidad,0)} x ${prodName(byId('Productos',it.productoId))} = ${money(it.cantidad*it.precio)}`).join('\n');
  const del=p.cobroEnvio?`\n🚚 Delivery: ${money(p.cobroEnvio)}`:'';
  let fotos='';
  if(o.adjuntas&&o.adjuntas.length){const L=o.adjuntas;fotos=`\n\n📸 Te adjuntamos ${L.length===1?'la foto':L.length+' fotos'}: ${[...new Set(L.map(c=>etqTxt(c.etiqueta||'delivery').toLowerCase()))].join(', ')}.`}
  else{const L=(o.links||fotosPed(p.id)).filter(c=>!c._pend&&c.url);if(L.length)fotos='\n\n📸 Fotos de tu pedido:\n'+L.map(c=>`${(etqInfo(c.etiqueta||'delivery')||['','📷'])[1]} ${etqTxt(c.etiqueta||'delivery')}: ${c.url}`).join('\n')}
  return `Hola 👋, te escribimos de ${cfg.negocio} 🥃\n\nPedido del ${fmtDate(p.fecha)} (${cliLabel(p.clienteId)}):\n${lines}${del}${p.fechaEntrega?`\n🚚 Entrega: ${fmtDate(p.fechaEntrega)}`:''}${!p.pagado&&p.fechaCompromiso?`\n📅 Fecha de pago: ${fmtDate(p.fechaCompromiso)}`:''}\n\n*Total: ${money(p.total)}*${zonaTxt(p)?`\n📍 Destino: ${zonaTxt(p)}`:''}${p.direccionEntrega?` · ${p.direccionEntrega}`:''}${fotos}${p.pagado?'\n✅ Pago recibido, ¡gracias!':''}\n\n¡Saca el burro que tienes dentro! 🔥`;
}

/* ---------- Componentes ---------- */
const tip=t=>`<div class="tip"><span>💡</span><p>${t}</p></div>`;
const empty=(ic,t,p,btn='')=>`<div class="empty"><div class="empty-ic">${ic}</div><h4>${t}</h4><p>${p}</p>${btn}</div>`;
const kpi=(ic,l,v,s='',tone='')=>`<div class="kpi ${tone}"><div class="kpi-ic">${ic}</div><div class="kpi-l">${l}</div><div class="kpi-v">${v}</div>${s?`<div class="kpi-s">${s}</div>`:''}</div>`;
const seg=(g,items,cur)=>`<div class="seg">${items.map(([k,l])=>`<button type="button" class="${k===cur?'on':''}" data-act="sub" data-group="${g}" data-val="${k}">${l}</button>`).join('')}</div>`;
const chips=(act,items,cur)=>`<div class="chips">${items.map(([k,l])=>`<button type="button" class="chip ${k===cur?'on':''}" data-act="${act}" data-val="${k}">${l}</button>`).join('')}</div>`;
const field=(label,input,hint='')=>`<label class="field"><span>${label}</span>${input}${hint?`<small>${hint}</small>`:''}</label>`;
const inp=(name,val,attrs='')=>`<input name="${name}" value="${esc(val??'')}" ${attrs}>`;
const sel=(name,opts,val,attrs='')=>`<select name="${name}" ${attrs}>${opts.map(o=>{const [v,l]=Array.isArray(o)?o:[o,o];return `<option value="${esc(v)}" ${String(v)===String(val??'')?'selected':''}>${esc(l)}</option>`}).join('')}</select>`;
const prodOpts=(val,blank)=>(blank?`<option value="">— Elige —</option>`:'')+tiposProducto().map(t=>{
  const ps=DB.Productos.filter(p=>p.tipo===t&&(!p.oculto||p.id===val)).sort((a,b)=>prodName(a).localeCompare(prodName(b)));
  return ps.length?`<optgroup label="${tipoIcon(t)} ${esc(t)}">${ps.map(p=>`<option value="${p.id}" ${p.id===val?'selected':''}>${esc(prodName(p))} · ${money(p.precio)}/${esc(p.unidad)}</option>`).join('')}</optgroup>`:'';
}).join('');
const insOpts=(val,blank)=>(blank?`<option value="">— Elige —</option>`:'')+[...DB.Insumos].sort((a,b)=>a.nombre.localeCompare(b.nombre)).map(i=>`<option value="${i.id}" ${i.id===val?'selected':''}>${esc(i.nombre)} (${esc(i.unidad)})</option>`).join('');

/* ---------- Gráficos ---------- */
let charts=[], pending=[];
function chart(id,config,tall){pending.push([id,config]);return `<div class="chart-box ${tall?'tall':''}"><canvas id="${id}"></canvas></div>`}
function drawCharts(){
  charts.forEach(c=>c.destroy()); charts=[];
  if(!window.Chart){pending=[];return}
  pending.forEach(([id,c])=>{const el=document.getElementById(id); if(el) charts.push(new Chart(el,c))}); pending=[];
}
if(window.Chart){Chart.defaults.font.family='Nunito, system-ui, sans-serif';Chart.defaults.font.weight=700;Chart.defaults.color='#7a6558'}
const legend={position:'bottom',labels:{boxWidth:12,boxHeight:12,usePointStyle:true,padding:14}};
function barCfg(labels,datasets,isMoney){
  return {type:'bar',data:{labels,datasets:datasets.map((d,i)=>Object.assign({borderRadius:7,maxBarThickness:34,backgroundColor:PAL[i]},d))},
    options:{responsive:true,maintainAspectRatio:false,plugins:{legend,tooltip:{callbacks:{label:c=>` ${c.dataset.label}: ${isMoney?money(c.raw):fmtNum(c.raw)}`}}},
      scales:{x:{grid:{display:false}},y:{beginAtZero:true,grid:{color:'#f0e4d3'},ticks:{callback:v=>isMoney?moneyShort(v):fmtNum(v,0)}}}}};
}
function lineCfg(labels,datasets){
  return {type:'line',data:{labels,datasets:datasets.map((d,i)=>Object.assign({borderColor:PAL[i],backgroundColor:PAL[i]+'22',fill:true,tension:.35,pointRadius:4,pointBackgroundColor:PAL[i],borderWidth:3},d))},
    options:{responsive:true,maintainAspectRatio:false,plugins:{legend},scales:{x:{grid:{display:false}},y:{beginAtZero:true,grid:{color:'#f0e4d3'}}}}};
}
function donutCfg(labels,data){
  return {type:'doughnut',data:{labels,datasets:[{data,backgroundColor:PAL,borderColor:'#fffdf9',borderWidth:3}]},
    options:{responsive:true,maintainAspectRatio:false,cutout:'62%',plugins:{legend,tooltip:{callbacks:{label:c=>{const t=c.dataset.data.reduce((a,b)=>a+b,0);return ` ${c.label}: ${money(c.raw)} (${t?Math.round(c.raw/t*100):0}%)`}}}}}};
}
function hbarCfg(labels,data){
  return {type:'bar',data:{labels,datasets:[{label:'Compras',data,backgroundColor:PAL[1],borderRadius:7,maxBarThickness:26}]},
    options:{indexAxis:'y',responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false},tooltip:{callbacks:{label:c=>' '+money(c.raw)}}},
      scales:{y:{grid:{display:false}},x:{beginAtZero:true,grid:{color:'#f0e4d3'},ticks:{callback:v=>moneyShort(v)}}}}};
}

/* ---------- Navegación ---------- */
const route={tab:'inicio',sub:{ventas:'pedidos',produccion:'lotes'},fPed:'todos',cFil:'todos',fProd:'todos',period:'mes',q:{ped:'',cli:''}};

    ${chart('chInicio',barCfg(s.labels,[{label:'Entró (ventas cobradas)',data:s.ing,backgroundColor:'#2e7d4f'},{label:'Salió (costos)',data:s.cos,backgroundColor:'#c0392b'}],true))}</div>

function quickGrid(){
  return `<div class="quick">${[['newPedido','🧾','Nuevo pedido'],['newLote','🏭','Registrar producción'],['newCompra','🛒','Compré insumos'],['newGasto','💸','Anotar un gasto'],['goClientes','👥','Mis pacientes'],['newBoleta','📎','Subir boleta'],['newMsg','💬','Anotar mensaje'],['goLab','🧪','Laboratorio'],['goCobranza','💰','Cobranza']]
    .map(([a,e,l])=>`<button type="button" class="qa" data-act="${a}"><span class="e">${e}</span>${l}</button>`).join('')}</div>`;

/* ===================== LABORATORIO (destilería) =====================
   El dueño vende; el laboratorio prepara. Cada pedido por entregar puede mandarse
   al laboratorio por WhatsApp: "Preparar 8 botellas … para el Paciente N° 2".
   Estado en el pedido: labEstado '' (sin avisar) → 'Enviado' (preparando) → 'Listo'. */
/* Laboratoristas: lista de contactos (nombre + WhatsApp) guardada en Ajustes. Puede haber 1, 2, 3 o más. */
function labs(){
  if(!Array.isArray(cfg.labs)){cfg.labs=cfg.labWa||cfg.labNombre?[{id:'l1',nombre:cfg.labNombre||'Laboratorio',wa:cfg.labWa||''}]:[]}
  return cfg.labs;
}
const labById=id=>labs().find(l=>l.id===id);
const labTxt=l=>l?`${l.nombre||'Laboratorista'}${l.wa?' · '+l.wa:''}`:'';
function labRow(l={}){return `<div class="labrow"><input type="hidden" name="labId" value="${esc(l.id||'l'+uid())}"><input name="labNom" value="${esc(l.nombre||'')}" placeholder="Nombre (Ej: Don Julio)" autocomplete="off"><input name="labTel" value="${esc(l.wa||'')}" type="tel" inputmode="tel" placeholder="WhatsApp (987 654 321)"><button type="button" class="btn sm ghost" data-act="delLabRow" aria-label="Quitar">✕</button></div>`}
function labsEditor(){return `<div class="subcard"><b>🧪 Laboratoristas</b><small class="muted" style="display:block;margin:2px 0 8px">A ellos les envías por WhatsApp las órdenes de preparación. Puedes tener los que quieras.</small>
  <div id="labRows">${(labs().length?labs():[{}]).map(labRow).join('')}</div>
  <button type="button" class="btn sm ghost" data-act="addLabRow">+ Agregar laboratorista</button></div>`}
function leerLabs(f){
  const ids=$$('[name=labId]',f).map(x=>x.value), ns=$$('[name=labNom]',f).map(x=>x.value.trim()), ts=$$('[name=labTel]',f).map(x=>x.value.trim());
  return ids.map((id,k)=>({id,nombre:ns[k],wa:ts[k]})).filter(l=>l.nombre||l.wa).map((l,k)=>Object.assign(l,{nombre:l.nombre||`Laboratorista ${k+1}`}));
}
const enLab=p=>p.estado==='Pendiente';
const labEst=p=>p.labEstado||'';
function labItems(p){return (p.items||[]).map(it=>`• ${fmtNum(it.cantidad,0)} ${uLbl(it.productoId,num(it.cantidad))} de ${prodName(byId('Productos',it.productoId))}`).join('\n')}
function labResumen(p){return (p.items||[]).map(it=>`${fmtNum(it.cantidad,0)} ${uLbl(it.productoId,num(it.cantidad))} de ${prodName(byId('Productos',it.productoId))}`).join(', ')}
function msgLab(L,o={}){
  const one=L.length===1, para=o.para, nota=o.nota, lab=o.lab;
  const bloque=p=>`👤 *${cliLabel(p.clienteId)}*${L.length>1&&(p.labPara||para)?` · para el ${fmtDate(p.labPara||para)}`:''}\n${labItems(p)}${p.labNota&&L.length>1?`\n📝 ${p.labNota}`:''}`;
  return `🧪 *ORDEN DE PREPARACIÓN* · ${cfg.negocio}\n\nHola${lab&&lab.nombre&&!/^Laboratorista \d+$/.test(lab.nombre)?' '+lab.nombre:''} 👋, ${one?`por favor prepara para el *${cliLabel(L[0].clienteId)}*:\n${labItems(L[0])}`:`por favor prepara estos ${L.length} pedidos:\n\n${L.map(bloque).join('\n\n')}`}${one&&para?`\n\n📅 Lo necesito para el *${fmtDate(para)}*`:''}${one&&nota?`\n📝 ${nota}`:''}${!one&&para?`\n\n📅 Para el *${fmtDate(para)}*`:''}${!one&&nota?`\n📝 ${nota}`:''}\n\nAvísame cuando esté listo ✅`;
}
function badgeLab(p){
  if(!enLab(p)) return '';
  const e=labEst(p);
  return e==='Listo'?'<span class="badge ok">🧪 Listo en laboratorio</span>':e==='Enviado'?`<span class="badge gold">🧪 Preparando${p.labA?' · '+esc(p.labA):''}${p.labPara?' · para el '+fmtDate(p.labPara).replace(/ \d{4}$/,''):''}</span>`:'<span class="badge">🧪 Sin avisar al laboratorio</span>';
}
function marcarLab(p,o){
  const H=[...(p.historial||[])]; H.push(hEv('lab',{a:o.para||'',m:o.lab?o.lab.nombre:'',n:o.nota||''}));
  saveRow('Pedidos',Object.assign({},p,{labEstado:'Enviado',labA:o.lab?o.lab.nombre:'',labFecha:today(),labPara:o.para||'',labNota:o.nota||'',historial:H}));
}
function formOrdenLab(ids,o={}){
  const L=ids.map(id=>byId('Pedidos',id)).filter(Boolean);
  if(!L.length) return;
  const reenv=L.some(p=>labEst(p));
  const para0=L.length===1?(L[0].labPara||''):'', nota0=L.length===1?(L[0].labNota||''):'';
  openSheet(L.length===1?'🧪 Avisar al laboratorio':`🧪 Avisar al laboratorio (${L.length} pedidos)`,`
    ${o.nuevo?`<div class="tip"><span>✅</span><p>Pedido anotado. ¿Le pides al laboratorio que lo prepare?</p></div>`:''}
    ${reenv?`<div class="warnbox" style="margin-bottom:12px">${L.length===1?`Ya se envió al laboratorio el <b>${fmtDate(L[0].labFecha)}</b>. Puedes reenviarlo.`:'Algunos ya se habían enviado; se reenviarán.'}</div>`:''}
    ${labs().length?`<div class="subcard"><b>👨‍🔬 ¿A quién se lo envías?</b><div class="labpick">${labs().map(l=>`<label class="check"><input type="radio" name="labSel" value="${esc(l.id)}" ${l.id===(labById(cfg.labUlt)?cfg.labUlt:labs()[0].id)?'checked':''}><span>${esc(l.nombre)}<br><small class="muted" style="font-weight:600">${l.wa?esc(l.wa):'Sin número: elegirás el contacto en WhatsApp'}</small></span></label>`).join('')}</div>
        <a href="#" data-act="labConfig" class="sm">✏️ Agregar o cambiar laboratoristas</a></div>`
      :`<div class="subcard"><b>👨‍🔬 Laboratorista</b><small class="muted" style="display:block;margin:2px 0 8px">Se guarda para la próxima. Luego puedes agregar más en ⚙️ Ajustes.</small><div class="row2">${field('Nombre',inp('nuevoNom','','placeholder="Ej: Don Julio"'))}${field('WhatsApp',inp('nuevoTel','','type="tel" inputmode="tel" placeholder="987 654 321"'))}</div></div>`}
    <div class="row2">${field('📅 ¿Para cuándo?',inp('para',para0,'type="date"'))}${field('📝 Nota para el laboratorio',inp('nota',nota0,'placeholder="Ej: con etiqueta nueva"'))}</div>
    <div class="wa-prev" id="labTxt"></div>
    `,
  {submitText:'💬 Enviar al laboratorio', labIds:ids,
   onOpen:f=>{SH.onInput(null,f)},
   onInput:(e,f)=>{const el=f.elements, lab=el.labSel?labById((f.querySelector('[name=labSel]:checked')||{}).value):{nombre:(el.nuevoNom&&el.nuevoNom.value.trim())||''};$('#labTxt').textContent=msgLab(L,{para:el.para.value,nota:el.nota.value.trim(),lab})},
   onSubmit:d=>{
     let lab=labById(d.labSel);
     if(!labs().length&&(d.nuevoNom||d.nuevoTel)){lab={id:'l'+uid(),nombre:d.nuevoNom||'Laboratorista 1',wa:d.nuevoTel||''};cfg.labs=[lab]}
     if(lab) cfg.labUlt=lab.id; guardarCfg();
     window.open(waLink(lab?lab.wa:'',msgLab(L,{para:d.para,nota:d.nota,lab})),'_blank');
     L.forEach(p=>marcarLab(byId('Pedidos',p.id)||p,{lab,para:d.para||p.labPara||'',nota:L.length===1?d.nota:(p.labNota||d.nota)}));
     toast((L.length===1?'🧪 Orden enviada':`🧪 ${L.length} órdenes enviadas`)+(lab?' a '+lab.nombre:' al laboratorio'));render()}});
}
function ordenLabLista(id){
  const p=byId('Pedidos',id); if(!p) return;
  saveRow('Pedidos',Object.assign({},p,{labEstado:'Listo',historial:[...(p.historial||[]),hEv('labListo')]}));
  toast('✅ Listo para entregar');render();
}
function formLabConfig(){
  const volver=SH&&SH.labIds;
  openSheet('🧪 Laboratoristas',`${labsEditor()}<small class="muted" style="display:block;text-align:center">Se guardan en este celular.</small>`,
  {onSubmit:(d,f)=>{cfg.labs=leerLabs(f);guardarCfg();toast(`Guardado ✅ (${cfg.labs.length} ${pl(cfg.labs.length,'laboratorista','laboratoristas')})`);render();if(volver)formOrdenLab(volver)}});
}
function guardarCfg(){store(CFG_KEY,{negocio:cfg.negocio,moneda:cfg.moneda,maxClientes:cfg.maxClientes,labs:labs(),labUlt:cfg.labUlt||''})}
function vOrdenesLab(){
  const P=DB.Pedidos.filter(enLab).sort((a,b)=>((a.labPara||a.fecha)+a.id).localeCompare((b.labPara||b.fecha)+b.id));
  const sin=P.filter(p=>!labEst(p)), prep=P.filter(p=>labEst(p)==='Enviado'), listo=P.filter(p=>labEst(p)==='Listo');
  const T=today();
  const card=p=>`<div class="item"><div class="item-top"><div><b data-act="verCliente" data-id="${p.clienteId}" style="cursor:pointer">${esc(cliLabel(p.clienteId))}</b><div class="muted sm">${esc(labResumen(p))||'Sin productos'}</div></div><div class="muted sm" style="text-align:right">🧾 ${fmtDate(p.fecha).replace(/ \d{4}$/,'')}</div></div>
    <div class="badges">${badgeLab(p)}${labEst(p)==='Enviado'&&p.labPara&&p.labPara<T?'<span class="badge bad">⏰ Ya pasó la fecha</span>':''}${labEst(p)&&p.labFecha?`<span class="badge">Enviado ${fmtDate(p.labFecha).replace(/ \d{4}$/,'')}</span>`:''}</div>
    ${p.labNota?`<div class="muted sm">📝 ${esc(p.labNota)}</div>`:''}
    <div class="actions">${!labEst(p)?`<button type="button" class="btn sm wa" data-act="labEnviar" data-id="${p.id}">🧪 Enviar al lab</button>`:''}
      ${labEst(p)==='Enviado'?`<button type="button" class="btn sm ok" data-act="labListo" data-id="${p.id}">✅ Ya está listo</button><button type="button" class="btn sm ghost" data-act="labEnviar" data-id="${p.id}">↻ Reenviar</button>`:''}
      ${labEst(p)==='Listo'?`<button type="button" class="btn sm ok" data-act="pedEntregado" data-id="${p.id}">🚚 Entregar</button>`:''}
      <button type="button" class="btn sm ghost" data-act="editPedido" data-id="${p.id}">Ver pedido</button></div></div>`;
  const tot=L=>{const m={};L.forEach(p=>(p.items||[]).forEach(it=>{const k=it.productoId;m[k]=(m[k]||0)+num(it.cantidad)}));return Object.entries(m).map(([k,n])=>`<b>${fmtNum(n,0)}</b> ${esc(uLbl(k,n))} de ${esc(prodName(byId('Productos',k)))}`).join(' · ')};
  if(!P.length) return `${tip('Aquí le pides al <b>laboratorio</b> que prepare cada pedido por WhatsApp, y ves qué está preparando y qué ya está listo.')}${empty('🧪','No hay pedidos por preparar','Cuando anotes un pedido por entregar, aparecerá aquí para enviarlo al laboratorio.',`<button type="button" class="btn" data-act="newPedido">+ Nuevo pedido</button>`)}`;
  return `${tip('Le pides al <b>laboratorio</b> por WhatsApp que prepare cada pedido. Cuando te avise que está listo, márcalo con <b>✅ Ya está listo</b>.')}

/* ---- Leer chats copiados o exportados de WhatsApp (Android y iPhone, formato 12 h o 24 h) ---- */
function parseChat(txt){
  txt=String(txt||'').replace(/[‎‏‪-‮﻿]/g,'').replace(/[  ]/g,' ').replace(/\r\n?/g,'\n');
  const AP='\\s*([ap])?\\.?\\s*m?\\.?';
  const RA=new RegExp('^\\[?(\\d{1,2})[/.-](\\d{1,2})[/.-](\\d{2,4}),?\\s+(\\d{1,2}):(\\d{2})(?::\\d{2})?'+AP+'\\]?\\s*(?:[-–]\\s*)?([^:\\n]{1,80}?):\\s?(.*)$','i');
  const RB=new RegExp('^\\[(\\d{1,2}):(\\d{2})(?::\\d{2})?'+AP+',\\s*(\\d{1,2})[/.-](\\d{1,2})[/.-](\\d{2,4})\\]\\s*([^:\\n]{1,80}?):\\s?(.*)$','i');
  const RD=/^\[?\d{1,2}[\/.-]\d{1,2}[\/.-]\d{2,4},?\s+\d{1,2}:\d{2}|^\[\d{1,2}:\d{2}[^\]]*,\s*\d{1,2}[\/.-]\d{1,2}[\/.-]\d{2,4}\]/;
  const raw=[]; let cur=null;
  txt.split('\n').forEach(line=>{
    let m=RA.exec(line), r=null;
    if(m) r={a:+m[1],b:+m[2],y:m[3],h:+m[4],mi:m[5],ap:m[6],au:m[7].trim(),t:m[8]};
    else if((m=RB.exec(line))) r={h:+m[1],mi:m[2],ap:m[3],a:+m[4],b:+m[5],y:m[6],au:m[7].trim(),t:m[8]};
    if(r){cur=r;raw.push(r)} else if(RD.test(line)) cur=null; else if(cur) cur.t+='\n'+line;
  });
  const md=raw.some(r=>r.b>12)&&!raw.some(r=>r.a>12);
  const msgs=raw.map(r=>{let h=r.h; if(r.ap){const pm=/p/i.test(r.ap); if(pm&&h<12)h+=12; if(!pm&&h===12)h=0}
    const d=md?r.b:r.a, mo=md?r.a:r.b, y=r.y.length===2?'20'+r.y:r.y;
    let t=r.t.trim(); if(/^<?[^<>]*omitid[oa]>?$|^<?[^<>]*omitted>?$/i.test(t)) t='📷 (foto, audio o archivo: no incluido)';
    return {fecha:`${y}-${pad(mo)}-${pad(d)}`,hora:`${pad(h)}:${r.mi}`,autor:r.au,texto:t}}).filter(x=>x.texto&&/^\d{4}-\d{2}-\d{2}$/.test(x.fecha));
  const cnt={}; msgs.forEach(x=>cnt[x.autor]=(cnt[x.autor]||0)+1);
  return {msgs,autores:Object.keys(cnt).map(n=>({n,c:cnt[n]})).sort((a,b)=>b.c-a.c)};
}

/* ---- Recibir lo que se comparte a la app desde WhatsApp u otra app (Android, app instalada) ---- */
async function leerCompartido(){
  if(!/[?&]compartido=1/.test(location.search)) return;
  history.replaceState(null,'',location.pathname);
  try{
    const c=await caches.open('latigo-share'), mr=await c.match('__share/meta'); if(!mr) return;
    const meta=await mr.json(), files=[];
    for(const f of meta.files||[]){const r=await c.match(f.key);if(r)files.push(new File([await r.blob()],f.name,{type:f.type}))}
    await Promise.all((await c.keys()).map(k=>c.delete(k)));
    const txt=files.find(f=>/text\/plain|\.txt$/i.test(f.type+' '+f.name)), imgs=files.filter(f=>/^image\//.test(f.type));
    let texto=txt?await txt.text():[meta.title,meta.text,meta.url].filter(Boolean).join('\n').trim();
    if(parseChat(texto).msgs.length>=2) return formImportarChat({texto});
    formMensaje({},{texto,files:imgs,origen:'compartido',verDespues:1});
  }catch(e){toast('No se pudo leer lo compartido','warn')}
}

function vCobranza(){

}

  ${chips('cFil',[['todos','Todos'],['reg','✅ Registrados'],['libres','⬜ Sin registrar'],['deben','💰 Deben'],['msgs','💬 Con mensajes'],['top','⭐ Los que más compran']],route.cFil)}
  <div id="list">${LISTS.cli()}</div>`;
};
LISTS.cli=()=>{
  const max=maxCli(), st=statsClientes(), q=route.q.cli.replace(/\D/g,''), f=route.cFil;
  const deu={};DB.Pedidos.forEach(p=>{const s0=saldo(p);if(s0>0)deu[p.clienteId]=(deu[p.clienteId]||0)+s0});
  const nm={},um={};DB.Mensajes.forEach(m=>{nm[m.clienteId]=(nm[m.clienteId]||0)+1;const k=m.fecha+(m.hora||'');if(!um[m.clienteId]||k>um[m.clienteId])um[m.clienteId]=k});
  let L=[];for(let n=1;n<=max;n++) L.push({n,reg:isReg(n),s:st[cliId(n)]||{n:0,total:0},debe:deu[cliId(n)]||0,nm:nm[cliId(n)]||0,um:um[cliId(n)]||''});
  if(q) L=L.filter(c=>String(c.n).startsWith(q));
  if(f==='reg') L=L.filter(c=>c.reg);
  if(f==='libres') L=L.filter(c=>!c.reg);
  if(f==='deben') L=L.filter(c=>c.debe>0).sort((a,b)=>b.debe-a.debe);
  if(f==='msgs') L=L.filter(c=>c.nm>0).sort((a,b)=>(b.um||'').localeCompare(a.um||''));
  if(f==='top') L=L.filter(c=>c.s.n>0).sort((a,b)=>b.s.total-a.s.total||b.s.n-a.s.n);
  if(!L.length) return empty('🔍','No hay números con ese filtro',f==='top'?'Cuando anotes pedidos, aquí verás quién compra más.':'Prueba con otro número o filtro.');
  return `<div class="cgrid">${L.map(cliTile).join('')}</div>
    <p class="muted sm" style="text-align:center;margin:14px 0 0">¿Necesitas más números? Cámbialo en ⚙️ Ajustes.</p>`;
};
function cliTile(c){
  return `<div class="ctile ${c.reg?'on':''}">

let SH=null;
function openSheet(title,body,o={}){
  SH=o; o.adj=[];
  $('#shTitle').textContent=title; $('#shBody').innerHTML=body; $('#shBody').scrollTop=0;
  $('#shSubmit').textContent=o.submitText||'Guardar'; $('#shSubmit').hidden=!!o.noSubmit;
  $('.sheet-f .btn.ghost').textContent=o.noSubmit?'Cerrar':'Cancelar';
  $('#shDelete').hidden=!o.onDelete;
  $('#sheet').classList.add('open'); document.body.classList.add('noscroll');
  if(o.onOpen) o.onOpen($('#shForm'));
}
function closeSheet(){$('#sheet').classList.remove('open');document.body.classList.remove('noscroll');SH=null}
$('#shForm').addEventListener('submit',e=>{
  e.preventDefault(); const cur=SH; if(!cur||!cur.onSubmit){closeSheet();return}
  const f=e.target, d={};
  for(const [k,v] of new FormData(f)) d[k]=typeof v==='string'?v.trim():v;
  const bad=$$('[required]',f).find(x=>!String(x.value).trim());
  if(bad){bad.focus();toast('Completa los campos marcados con *','bad');return}
  const r=cur.onSubmit(d,f);
  if(r!==false&&SH===cur) closeSheet();
});
['input','change'].forEach(ev=>$('#shForm').addEventListener(ev,e=>{if(SH&&SH.onInput) SH.onInput(e,$('#shForm'))}));
$('#sheet').addEventListener('click',e=>{if(e.target.id==='sheet') closeSheet()});
document.addEventListener('keydown',e=>{if(e.key==='Escape') closeSheet()});

function ask(msg,ok='Sí, eliminar'){
  return new Promise(res=>{
    $('#cfMsg').innerHTML=msg; $('#cfOk').textContent=ok; $('#confirm').classList.add('open');
    const done=v=>{$('#confirm').classList.remove('open');$('#cfOk').onclick=$('#cfNo').onclick=null;res(v)};
    $('#cfOk').onclick=()=>done(true); $('#cfNo').onclick=()=>done(false);
  });
}
async function confirmDel(sheet,id,what){
  if(await ask(`¿Seguro que quieres eliminar ${what}? No se puede deshacer.`)){delRow(sheet,id);closeSheet();render();toast('Eliminado 🗑️')}
}
let toastT;
function toast(m,t=''){const el=$('#toast');el.textContent=m;el.className='toast show '+t;clearTimeout(toastT);toastT=setTimeout(()=>el.className='toast '+t,3200)}
function needFirst(msg,act,label){openSheet('Falta un pasito',empty('👣','Antes de esto…',msg),{submitText:label,onSubmit:()=>{setTimeout(()=>ACT[act]({}),60)}})}

function ayuda(){
  openSheet('❓ ¿Cómo funciona?',`<div class="help"><img class="label-img" src="img/etiqueta.jpg" alt="Etiqueta de El Látigo">
    <p>Esta app lleva las cuentas de <b>El Látigo</b> por ti. Solo anota lo que pasa y ella calcula stock, costos y ganancias.</p>
    <h4>🔁 El ciclo del negocio</h4>
    <ol><li><b>Compras insumos</b> 🛒 → suben en tu almacén.</li><li><b>Produces un lote</b> 🏭 → se descuentan insumos y sube tu stock.</li><li><b>Vendes en un pedido</b> 🧾 → baja el stock.</li><li><b>Te pagan</b> 💵 → eso es plata que entró.</li></ol>
    <h4>📖 Palabras clave</h4>
    <ul><li><b>Plata que entró:</b> pedidos marcados como cobrados.</li><li><b>Plata que salió:</b> compras de insumos + gastos + otros costos de lotes + envíos, embalajes y fletes de los pedidos.</li><li><b>Laboratorista:</b> se le paga cada quincena. Registra el pago en Producción → 🧪 Laborat.; se reparte entre lo producido en esa quincena y suma al costo por unidad.</li><li><b>Fechas y fiados:</b> cada pedido guarda su fecha de pedido, de entrega y de pago. Al entregar puedes marcar <b>🤝 fiado</b> con la fecha en que pagará. Si promete pagar otro día usa <b>📅 Aplazar</b>, y con <b>🔔 Recordar</b> le envías por WhatsApp su pedido, entrega y monto. Todo queda en la trazabilidad del pedido. Mira <b>Ventas → 💰 Cobranza</b>.</li><li><b>Deuda acumulada:</b> si un paciente vuelve a pedir sin haber pagado, su deuda se suma. En su <b>💰 cuenta</b> ves todo lo que debe, registras pagos parciales (se aplican al pedido más antiguo), le recuerdas toda la deuda por WhatsApp y puedes ponerle un límite de fiado.</li><li><b>Laboratorio 🧪:</b> tú vendes y el laboratorio prepara. Al anotar un pedido, la app te ofrece enviarle por WhatsApp la orden (“Preparar 8 botellas para el Paciente N° 2”). En <b>Ventas → 🧪 Laboratorio</b> ves qué falta avisar, qué está preparando y qué ya está listo.</li><li><b>Fotos del pedido 📸:</b> en cada pedido puedes subir varias fotos (producto embalado, comprobante de delivery, de embalaje, guía de agencia). Quedan guardadas en el pedido y con <b>WhatsApp</b> se envían todas juntas al paciente.</li><li><b>Mensajes 💬:</b> en la ficha de cada paciente guardas lo que te escribe: copia el mensaje en WhatsApp y pégalo, o importa el chat completo (Exportar chat → Sin archivos). Quedan como historial con fecha y hora.</li><li><b>Delivery y embalaje:</b> son costos de cada pedido; se anotan dentro del pedido.</li><li><b>Boletas 📎:</b> en cada compra, gasto y envío puedes tomar una foto o subir un PDF del comprobante. Se convierte en un link (ImgBB) y la hoja guarda solo ese link. En Producción → 📎 Boletas ves todas y lo que falta adjuntar.</li><li><b>Envíos:</b> en cada pedido anota el destino (distrito o provincia) y lo que pagaste de envío, embalaje y flete. La app recuerda el último costo a cada destino.</li><li><b>Ganancia:</b> lo que entró menos lo que salió.</li><li><b>Costo por unidad:</b> lo que te costó el lote ÷ lo que salió (botellas, bolsas, frascos…).</li><li><b>Tipos de producto:</b> líquidos, sólidos o los que crees. Se eligen al crear un producto.</li><li><b>Te deben:</b> pedidos que aún no te pagan.</li><li><b>Pacientes:</b> son números (1, 2, 3…) como en tu cuaderno. El ✅ indica que ya está registrado.</li><li><b>Paciente frecuente ⭐:</b> 3 pedidos o más.</li></ul>
    <h4>📲 Tenla como app en tu celular</h4>
    <p>Toca <b>Instalar</b> (en Inicio o en ⚙️ Ajustes) y tendrás el ícono del burro en tu pantalla de inicio. Cuando haya mejoras, se actualiza sola: <b>no hace falta volver a instalar</b>.</p>
    <h4>🟢 El punto de arriba</h4>
    <p><b>Verde:</b> conectado a Google Sheets · <b>Amarillo:</b> guardando · <b>Rojo:</b> sin conexión (lo que anotes se sube después) · <b>Gris:</b> solo en este celular. Toca el punto para actualizar.</p>
    <h4>✨ Truco</h4>
    <p>El botón dorado <b>+</b> te deja registrar cualquier cosa desde cualquier pantalla.</p></div>`,{noSubmit:true});
}
function download(name,content,type){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([content],{type}));a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500)}
function csv(name,rows){
  if(!rows.length){toast('No hay datos para descargar','warn');return}
  const h=Object.keys(rows[0]),q=v=>`"${String(v??'').replace(/"/g,'""')}"`;
  download(`${name}_${today()}.csv`,'\ufeff'+[h.map(q).join(';'),...rows.map(r=>h.map(k=>q(r[k])).join(';'))].join('\n'),'text/csv;charset=utf-8');
}

  d.Mensajes=[['n12',-6,'09:14','paciente','Hola, ¿me puedes mandar 2 más? El viernes te pago todo 🙏'],['n12',-6,'09:20','yo','Claro, te lo mando mañana. Recuerda que vas S/ 150 😉'],['n12',-5,'18:02','paciente','Ya me llegó, gracias. Muy bueno el sólido 👌'],['n3',-2,'11:40','paciente','¿Tienes el de 750 ml? Para el sábado'],['n3',-2,'11:45','yo','Sí, te lo preparo y te aviso'],['n7',-1,'20:15','paciente','Me encantó, mi papá dice que le ayudó mucho con las rodillas']]
    .map(([c,dd,h,de,t],i)=>({id:'md'+i,fecha:addD(T,dd),hora:h,clienteId:c,de,texto:t,fotos:[],pedidoId:'',origen:'manual',creado:addD(T,dd)}));
  {const acc=[...d.Pedidos].filter(p=>p.clienteId==='n12'&&p.estado==='Entregado').slice(-3);
   acc.forEach((p,i)=>{p.pagado=false;p.metodoPago='';p.fechaPago='';p.abonado=i===0?20:0;p.fechaCompromiso=i===0?addD(T,-6):addD(T,3);
     p.historial=[hEv('pedido',{f:p.fecha}),hEv('fiado',{f:p.fechaEntrega,a:p.fechaEntrega}),hEv('compromiso',{f:p.fechaEntrega,a:p.fechaCompromiso})].concat(i===0?[hEv('abono',{f:addD(T,-8),a:addD(T,-8),m:'Yape',v:20})]:[])});
   const c12=d.Clientes.find(c=>c.id==='n12'); if(c12) c12.limite=500;}
  return serializeAll(d);
}
function serializeAll(d){const o={};Object.keys(SCHEMA).forEach(k=>o[k]=d[k].map(r=>serializeRow(k,normalizeRow(k,r))));return o}

setTimeout(()=>$('#splash').classList.add('out'),900);
setSync(cfg.apiUrl?'busy':'local');
if(cfg.apiUrl) syncAll(false);
leerCompartido();
window.addEventListener('online',()=>{if(cfg.apiUrl){syncAll(false);processUploads()}});

/* ===================== INSTALAR EN EL CELULAR =====================
   - Android/Chrome: usa el instalador del navegador. El navegador NO lo ofrece
     si la app ya está instalada, así no se duplica el ícono.
   - Dentro de la app instalada nunca se muestra el botón.
   - iPhone: Apple no deja instalar con un botón; se muestran los pasos.
   - Las versiones nuevas se actualizan solas en el mismo ícono (manifest id fijo).
   ================================================================== */
function puedeInstalar(){
  if(esApp()||load('latigo_instalada',0)) return false;
  return !!installEvt||(IS_IOS&&!load('latigo_ios_agregada',0));
}
function installBanner(){
  if(!puedeInstalar()) return '';
  const pospuesto=load('latigo_install_luego',0); if(pospuesto&&Date.now()-pospuesto<3*864e5) return '';
  return `<div class="install"><img src="img/icon-192.png" alt=""><div><b>Instala El Látigo en tu celular</b><p>Ábrela con un toque desde tu pantalla de inicio, como una app.</p></div>
    <button type="button" class="btn sm gold" data-act="install">Instalar</button><button type="button" class="icon-btn x" data-act="installLuego" aria-label="Ahora no">✕</button></div>`;
}
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();installEvt=e;store('latigo_instalada',0);/* el navegador solo avisa esto si NO está instalada */if(route.tab==='inicio')render()});
window.addEventListener('appinstalled',()=>{installEvt=null;store('latigo_instalada',1);toast('¡Listo! Busca el ícono de El Látigo en tu pantalla de inicio 🔥');render()});
Object.assign(ACT,{
  install:async()=>{
    if(esApp()){toast('Ya estás usando la app instalada ✅');return}
    if(installEvt){
      closeSheet(); installEvt.prompt();
      const r=await installEvt.userChoice.catch(()=>({outcome:'dismissed'})); installEvt=null;
      if(r.outcome==='accepted'){store('latigo_instalada',1);toast('Instalando… búscala en tu pantalla de inicio 🔥')}
      render(); return;
    }
    if(IS_IOS){
      openSheet('📲 Agregar a tu iPhone',`<p style="margin-top:0">En iPhone se agrega en 3 toques desde <b>Safari</b>:</p>
        <ol class="steps-ios"><li><span>Toca el botón <b>Compartir</b> ⬆️ (abajo en la pantalla)</span></li><li><span>Elige <b>“Agregar a inicio”</b> ➕</span></li><li><span>Toca <b>“Agregar”</b> arriba a la derecha</span></li></ol>
        <div class="tip"><span>💡</span><p>Hazlo <b>una sola vez</b>. Cuando mejoremos la app, el mismo ícono abrirá la versión nueva.</p></div>`,
        {submitText:'Ya lo agregué ✅',onSubmit:()=>{store('latigo_ios_agregada',1);toast('¡Perfecto! Ábrela desde tu pantalla de inicio 🔥');render()}});
      return;
    }
    if(load('latigo_instalada',0)){toast('La app ya está instalada en este equipo ✅');return}
    openSheet('📲 Instalar la app',`<p style="margin-top:0">Abre este mismo link en <b>Chrome</b> (Android) o <b>Safari</b> (iPhone) y toca <b>Instalar</b>.</p>
      <div class="tip"><span>💡</span><p>Si ya la instalaste antes, no hace falta hacerlo de nuevo: el ícono siempre abre la versión más nueva.</p></div>`,{noSubmit:true});
  },
  installLuego:()=>{store('latigo_install_luego',Date.now());render()},
});
if('serviceWorker' in navigator && /^https?:$/.test(location.protocol)){
  window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
}
